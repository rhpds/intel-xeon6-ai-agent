apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: intel-xeon6-ai-agent
  title: intel-xeon6-ai-agent
  description: A 45-minute hands-on lab for Intel and Red Hat technical sellers
    and solution architects. Learners deploy a lightweight LangGraph
    solution-advisor agent on Red Hat OpenShift, connect three MCP tools for
    sourced Intel hardware and Red Hat platform information, and generate an
    illustrative solution brief using tenant-scoped RACMaaS CPU inference on
    Intel Xeon 6. The lab demonstrates agent orchestration, structured tool
    calling, and human validation of AI-generated recommendations. Triforce
    provides the versioned application implementation, while this project owns
    the learner-facing Showroom content and Publishing House lifecycle.
  annotations:
