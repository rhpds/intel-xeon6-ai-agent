# Publishing House — Project Spec
# Lifecycle: intake → content_review → infra_review → jira_sync → development → ready → published
# No secrets in this file. Tokens live in ~/.config/publishing-house/auth.json
# Stage is managed by SonataFlow and cached in .ph-state — do not edit stage.current manually.
# NOTE: This file is also in the template repo. The Scaffolder overlays project.* values.
# TODO: Eliminate this copy — Scaffolder should pull from template repo directly.

project:
  slug: "intel-xeon6-ai-agent"
  owner_email: "jkershaw@redhat.com"
  content_type: "lab"
  deployment_mode: "rhdp_published"
  initiative_key: "none"
  showroom_type: "classic"
  intake_type: "migration"
  automation_type: "ansible"
  description: "A 45-minute hands-on lab for Intel and Red Hat technical sellers and solution architects. Learners deploy a lightweight LangGraph solution-advisor agent on Red Hat OpenShift, connect three MCP tools for sourced Intel hardware and Red Hat platform information, and generate an illustrative solution brief using tenant-scoped RACMaaS CPU inference on Intel Xeon 6. The lab demonstrates agent orchestration, structured tool calling, and human validation of AI-generated recommendations. Triforce provides the versioned application implementation, while this project owns the learner-facing Showroom content and Publishing House lifecycle."
  # content_reviewer_email and infra_reviewer_email are assigned by the RHDP team — not set by the author
  jira_ticket: ""
  workflow_id: ""

spec:
  title: "Intel Xeon 6 201: Building an AI Agent"
  learning_objectives:
  - "Deploy and verify an MCP tool service that returns sourced Intel and Red Hat platform data."
  - "Deploy and connect a LangGraph agent and browser UI to tenant-scoped RACMaaS inference."
  - "Evaluate and tune agent output by changing prompts, customer scenarios, and CPU-served models."
  modules:
  - {id: module-01, title: "Anatomy of an Agent", duration_min: 10}
  - {id: module-02, title: "Deploy the MCP Tools", duration_min: 10}
  - {id: module-03, title: "Wire the Agent", duration_min: 10}
  - {id: module-04, title: "Test and Tune", duration_min: 15}
  environment:
    platform: "ocp"
    topology: "shared-cluster"
    cloud_provider: cnv        # cnv | aws | troshka — cnv is default
    max_concurrent_users: 4

    # --- OCP-specific fields (only when platform = ocp) ---
    ocp_version: "4.22"
    cluster_type: "multinode"
    control_plane_instance_count: null # 1 if sno, 3 if multinode
    control_plane_cpu: null            # 32 if sno, 16 if multinode
    control_plane_ram_gb: null         # 128 if sno, 64 if multinode
    worker_count: null                 # number of OCP worker nodes
    worker_cpu: null                   # vCPU per worker
    worker_ram_gb: null                # RAM per worker in GB
    worker_disk_gb: null               # disk per worker in GB

    # --- VM-specific fields (only when platform = rhel-vms) ---
    # Each entry: {role, count, cpu, ram_gb, disk_gb, os}
    vms_per_student: []

    # --- Common fields (both platforms) ---
    aap_version: ""                    # required if AAP in products
    ai_requirement: "maas"
    ai_model_tier: "open-source"
    ai_model_name: "qwen25-3b-cpu"
    ai_justification: ""               # required if ai_model_tier = frontier or ai_requirement = gpu
    non_ga_products: []                # list of non-GA products/versions
    non_ga_access_plan: ""             # how access is provided for non-GA products
    external_services: ["github.com", "quay.io", "RACMaaS"]
    gpu_nodes: 0                       # number of GPU nodes (0 = none)
    gpu_type: ""                       # e.g. NVIDIA A100 40GB (required if gpu_nodes > 0)
  duration_hours: 0.75
  audience: "intermediate"

development:
  automation:
    ansible:
      status: not_started
  e2e:
    status: not_started
  healthCheck:
    status: not_started

compliance:
  last_hard_check: null
  hard_result: null

tracking:
  paused: false
  pause_reason: null

# Approval checklist — filled collaboratively by author + skill + system + reviewers
approval_checklist:

  content:
    prerequisites_verifiable: true
    assessment_strategy: "Classic-lab verification blocks use observable pod, MCP, API, and UI results; learners also compare model quality and latency."
    catalog_gap: "Provides an Intel Xeon 6 CPU-inference agent-building lab for technical sellers; it is not a duplicate quick start."
    design_overview: "Learners progress from agent concepts to MCP deployment, RACMaaS-backed orchestration, and prompt/model tuning in an isolated OpenShift tenant namespace."
    module_summaries:
    - "Identify the roles of the model, tools, prompt, and orchestration layer."
    - "Deploy and exercise three MCP tools containing sourced workshop data."
    - "Deploy the agent and UI and verify a structured RACMaaS-backed recommendation."
    - "Evaluate scenarios, customize the prompt, and compare CPU-served models."
    rcars_overlap_pct: null
    rcars_top_matches: []
    rejections: []

  infra:
    peak_environments: 4
    cost_per_run_est: "Shared-cluster tenant workload; no dedicated cluster or GPU allocation per learner."
    provisioning_time_est: "Approximately 10-15 minutes, subject to shared-cluster availability."
    agnosticv_base_ci: "ai-lab-xeon6-inference; ai-quickstarts.ai-qs-triforce-201-tenant.dev"
    approved_by: ""
    rejections: []
